seed: 1729
device: cuda
data:
  dataset: vitaldb
  root: data/vitaldb
  sample_rate: 250
  window_seconds: 30
  stride_seconds: 2
  channels: 16
model:
  embedding_dim: 256
  manifold_dim: 3
  hidden_dim: 512
  invertible_blocks: 2
  atlas_hidden: [128, 64]
  atlas_classes: 3
  backbones: [neurolm_xl, labram_base, cbramod, reve, csbrain]
science:
  normal_form_weight: 0.01
  coherence_threshold: 0.8
  normal_coordinate_tolerance: 0.1
  disagreement_sigma: 3.0
  coherence_window: 30
  exponent_window_seconds: 120
training:
  status: not_reported_in_manuscript
  batch_size: 32
  gradient_accumulation: 1
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  warmup_steps: 1000
  precision: bf16
  gradient_clip: 1.0
  seeds: 15
  world_size: 1
evaluation:
  bootstrap_resamples: 10000
  calibration_bins: 20
  alpha: 0.05
compute:
  primary: 1x NVIDIA A100 80GB, approximately 48 hours
  parallel: 4x NVIDIA A100 80GB, approximately 14 hours
